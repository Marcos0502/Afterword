name: AFTERWAR Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 -o "$HOME/godot/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          mv "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          curl -L --fail --retry 3 -o "$HOME/godot/templates.tpz" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -R "$HOME/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest"

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/afterwar-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: afterwar-android-debug
          path: build/afterwar-debug.apk
          if-no-files-found: error
