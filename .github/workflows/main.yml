name: AFTERWAR Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager no encontrado:"
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0"

      - name: Set up Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail

          GODOT_VERSION="4.7.2"
          GODOT_DIR="$HOME/godot"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$GODOT_DIR"
          mkdir -p "$TEMPLATE_DIR"
          
          echo "4.7.2.stable" > "$TEMPLATE_DIR/version.txt"

          curl -L --fail --retry 3 \
            -o "$GODOT_DIR/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"

          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"

          mv \
            "$GODOT_DIR/Godot_v4.7.2-stable_linux.x86_64" \
            "$GODOT_DIR/godot"

          chmod +x "$GODOT_DIR/godot"

          curl -L --fail --retry 3 \
            -o "$GODOT_DIR/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"

          unzip -q "$GODOT_DIR/templates.tpz" -d "$GODOT_DIR/templates"

          cp -R \
            "$GODOT_DIR/templates/templates/"* \
            "$TEMPLATE_DIR/"

          echo "$GODOT_DIR" >> "$GITHUB_PATH"

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            build/afterwar-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -f build/afterwar-debug.apk

          ls -lh build/afterwar-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AFTERWAR-Android-APK
          path: build/afterwar-debug.apk
          if-no-files-found: error
